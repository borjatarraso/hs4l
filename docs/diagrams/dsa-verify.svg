<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="DSA verify dataflow. s and q feed a modular inverse to give w = s^-1 mod q. Then u1 = z*w mod q (z = SHA-1 digest) and u2 = r*w mod q. u1, u2 and the domain params g,y,p,q feed v = (g^u1 * y^u2 mod p) mod q. Finally compare v with r: if equal, accept.">
<rect x="0" y="0" width="820" height="250" fill="#0b0f13"/>
<defs><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#8f8266"/></marker></defs>
<rect x="14" y="30" width="150" height="52" rx="7" fill="#7fd0e0" fill-opacity="0.10" stroke="#7fd0e0"/>
<text x="89" y="52" text-anchor="middle" fill="#7fd0e0" font-size="13">s, q</text>
<text x="89" y="70" text-anchor="middle" fill="#8f8266" font-size="10.5">s = 8782…3bb7</text>
<rect x="200" y="30" width="176" height="52" rx="7" fill="#e9ddc7" fill-opacity="0.05" stroke="#8f8266"/>
<text x="288" y="52" text-anchor="middle" fill="#e9ddc7" font-size="13">w = s⁻¹ mod q</text>
<text x="288" y="70" text-anchor="middle" fill="#8f8266" font-size="10.5">modular inverse</text>
<rect x="200" y="108" width="176" height="46" rx="7" fill="#e9ddc7" fill-opacity="0.05" stroke="#8f8266"/>
<text x="288" y="130" text-anchor="middle" fill="#e9ddc7" font-size="13">u1 = z·w mod q</text>
<text x="288" y="147" text-anchor="middle" fill="#8f8266" font-size="10.5">z = a91e…a899 (SHA-1)</text>
<rect x="200" y="176" width="176" height="46" rx="7" fill="#e9ddc7" fill-opacity="0.05" stroke="#8f8266"/>
<text x="288" y="198" text-anchor="middle" fill="#e9ddc7" font-size="13">u2 = r·w mod q</text>
<text x="288" y="215" text-anchor="middle" fill="#8f8266" font-size="10.5">r = 6027…46e3</text>
<rect x="428" y="88" width="210" height="74" rx="8" fill="#f2b43a" fill-opacity="0.08" stroke="#f2b43a"/>
<text x="533" y="118" text-anchor="middle" fill="#f2b43a" font-size="13" font-weight="600">v = (gᵘ¹·yᵘ² mod p) mod q</text>
<text x="533" y="140" text-anchor="middle" fill="#8f8266" font-size="10.5">domain params p (1024b), q (160b), g</text>
<rect x="676" y="96" width="130" height="58" rx="8" fill="#4fd08a" fill-opacity="0.12" stroke="#4fd08a" stroke-width="2"/>
<text x="741" y="122" text-anchor="middle" fill="#4fd08a" font-size="13" font-weight="600">v == r ?</text>
<text x="741" y="142" text-anchor="middle" fill="#4fd08a" font-size="11">ACCEPT</text>
<line x1="164" y1="56" x2="200" y2="56" stroke="#8f8266" stroke-width="1.6" marker-end="url(#af)"/>
<line x1="288" y1="82" x2="288" y2="108" stroke="#8f8266" stroke-width="1.6" marker-end="url(#af)"/>
<line x1="288" y1="154" x2="288" y2="176" stroke="#8f8266" stroke-width="1.6" marker-end="url(#af)"/>
<line x1="376" y1="128" x2="428" y2="118" stroke="#8f8266" stroke-width="1.6" marker-end="url(#af)"/>
<line x1="376" y1="196" x2="428" y2="140" stroke="#8f8266" stroke-width="1.6" marker-end="url(#af)"/>
<line x1="638" y1="125" x2="676" y2="125" stroke="#4fd08a" stroke-width="2" marker-end="url(#af)"/>
</svg>
