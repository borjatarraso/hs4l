<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="Two SPYCOS response headers for GenerateDSAKeyPair opcode 0x85, as big-endian 32-bit words. Both have word zero 0x90000085 (0x90 marker plus echoed opcode). The failing response has word four 0x0000000a, result code 10 Execution Failure, in red. The passing response has word four 0x00000001, result code 1 Passed, in green. Only word four differs.">
